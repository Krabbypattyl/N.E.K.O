<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="theater.title">小剧场 - Project N.E.K.O.</title>
    <script src="/static/i18n-i18next.js?v={{ static_asset_version }}"></script>
    <link rel="stylesheet" href="/static/css/theater.css?v={{ static_asset_version }}">
    <link rel="stylesheet" href="/static/css/theater_home.css?v={{ static_asset_version }}">
    <link rel="stylesheet" href="/static/css/window_controls.css?v={{ static_asset_version }}">
    <script src="/static/theme-manager.js?v={{ static_asset_version }}"></script>
    <script src="/static/js/window_controls.js?v={{ static_asset_version }}" defer></script>
</head>
<body>
    <main class="theater-home-shell">
        <header class="theater-title-bar page-title-bar">
            <div class="theater-title-copy">
                <h2 data-i18n="theater.title">小剧场</h2>
                <span class="theater-mode-badge" data-i18n="theater.modeLabel">模式选择</span>
            </div>
            <div class="neko-window-controls theater-window-controls">
                <button type="button" class="neko-window-control-btn" data-neko-window-control="minimize" data-i18n-title="common.minimize" data-i18n-aria="common.minimize" title="最小化" aria-label="最小化"><span class="neko-window-minimize-icon"></span></button>
                <button type="button" class="neko-window-control-btn" data-neko-window-control="maximize" data-i18n-title="common.maximize" data-i18n-aria="common.maximize" title="最大化" aria-label="最大化"><span class="neko-window-maximize-icon"></span></button>
                <button type="button" class="neko-window-control-btn theater-close-btn" data-neko-window-control="close" data-i18n-title="common.close" data-i18n-aria="common.close" title="关闭" aria-label="关闭"><span class="theater-close-icon" aria-hidden="true"></span></button>
            </div>
        </header>

        <section class="theater-home-content" aria-labelledby="theater-home-title">
            <div class="theater-home-heading">
                <p class="theater-home-kicker" data-i18n="theater.homeKicker">N.E.K.O. 小剧场</p>
                <h1 id="theater-home-title" data-i18n="theater.homeTitle">选择你的演绎方式</h1>
                <p data-i18n="theater.homeSubtitle">一个入口，进入作者编排的剧本，或导入角色卡自由聊天。</p>
            </div>

            <div class="theater-mode-cards">
                <a class="theater-mode-card theater-mode-card-script" href="/theater-numeric">
                    <span class="theater-mode-card-kicker" data-i18n="theater.scriptMode">剧本模式</span>
                    <strong data-i18n="theater.homeScriptTitle">剧本模式</strong>
                    <span data-i18n="theater.homeScriptDescription">💬 自由对话：不仅可以选 A/B/C，而且可以自由输入，实时改写剧情。<br>🎭 性格演绎：千人千面！不同性格的猫娘，对同一句话给出截然不同的反应。<br>🌌 无限互动：你的每一句话都在创造独一无二的故事。</span>
                    <span class="theater-mode-card-action" data-i18n="theater.homeEnter">进入剧本模式 →</span>
                </a>
                <div class="theater-mode-card theater-mode-card-free" aria-disabled="true">
                    <span class="theater-mode-card-kicker" data-i18n="theater.freeMode">自由模式</span>
                    <strong data-i18n="theater.homeFreeTitle">自由模式</strong>
                    <span data-i18n="theater.homeFreeDescription">自由模式支持角色卡导入，与猫娘进行不受剧本约束的聊天演绎。</span>
                    <span class="theater-mode-card-action" data-i18n="theater.homeFreeUnavailable">暂未开放</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
